<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1010" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#56606e"/>
    </marker>
    <marker id="arrowd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="1010" fill="#fbfcfd"/>
  <text x="450" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#1e2937">GrafAnc &#8594; FLARE Local-Ancestry Pipeline</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#56606e">All of Us Researcher Workbench &#183; CDR v9</text>

  <!-- ================= STAGE 1 : INPUT ================= -->
  <text x="34" y="112" font-size="12.5" font-weight="700" fill="#56606e" letter-spacing="0.5">1 &#183; INPUT DATA</text>
  <rect x="150" y="118" width="250" height="54" rx="10" fill="#dbe6f4" stroke="#3f6191" stroke-width="1.5"/>
  <text x="275" y="150" text-anchor="middle" font-size="14" fill="#1e2937">WGS callset</text>
  <rect x="500" y="118" width="250" height="54" rx="10" fill="#dbe6f4" stroke="#3f6191" stroke-width="1.5"/>
  <text x="625" y="150" text-anchor="middle" font-size="14" fill="#1e2937">Imputed array</text>
  <rect x="215" y="206" width="470" height="54" rx="10" fill="#dbe6f4" stroke="#3f6191" stroke-width="1.5"/>
  <text x="450" y="233" text-anchor="middle" font-size="13" fill="#1e2937">Union of participants &#8212; 282,424 ancestry SNPs</text>
  <text x="450" y="250" text-anchor="middle" font-size="12" fill="#56606e">+ light in-house QC (call rate, biallelic, GQ/DP)</text>
  <line x1="275" y1="172" x2="405" y2="206" stroke="#56606e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="625" y1="172" x2="495" y2="206" stroke="#56606e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= STAGE 2 : GRAFANC ================= -->
  <text x="34" y="308" font-size="12.5" font-weight="700" fill="#56606e" letter-spacing="0.5">2 &#183; GrafAnc GLOBAL ANCESTRY</text>
  <line x1="450" y1="260" x2="450" y2="316" stroke="#56606e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="150" y="316" width="600" height="66" rx="10" fill="#d3ebe6" stroke="#2f7d73" stroke-width="1.5"/>
  <text x="450" y="342" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e2937">GrafAnc &#8594; AncGroupID per participant</text>
  <text x="450" y="365" text-anchor="middle" font-size="12" fill="#37474f">African American &#183; Latin American 1/2 &#183; Native American &#183; Multiracial</text>

  <!-- ================= STAGE 3 : ADMIXTURE ================= -->
  <text x="34" y="430" font-size="12.5" font-weight="700" fill="#56606e" letter-spacing="0.5">3 &#183; RESOLVE MULTIRACIAL</text>
  <line x1="450" y1="382" x2="450" y2="438" stroke="#56606e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="150" y="438" width="600" height="58" rx="10" fill="#d3ebe6" stroke="#2f7d73" stroke-width="1.5"/>
  <text x="450" y="464" text-anchor="middle" font-size="13" fill="#1e2937">Supervised ADMIXTURE &#8212; 7 superpops</text>
  <text x="450" y="482" text-anchor="middle" font-size="11.5" fill="#56606e">AFR &#183; EUR &#183; AMR &#183; SAS &#183; EAS &#183; MEN &#183; OCN  (with OTHER &#8804; threshold gate)</text>
  <rect x="180" y="540" width="250" height="48" rx="10" fill="#e7eaee" stroke="#5f6b7a" stroke-width="1.5"/>
  <text x="305" y="569" text-anchor="middle" font-size="13" fill="#1e2937">2-way  AFR-EUR</text>
  <rect x="470" y="540" width="250" height="48" rx="10" fill="#e7eaee" stroke="#5f6b7a" stroke-width="1.5"/>
  <text x="595" y="569" text-anchor="middle" font-size="13" fill="#1e2937">3-way  AFR-EUR-AMR</text>
  <line x1="405" y1="496" x2="320" y2="540" stroke="#56606e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="495" y1="496" x2="590" y2="540" stroke="#56606e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= STAGE 4 : FLARE ================= -->
  <text x="34" y="628" font-size="12.5" font-weight="700" fill="#56606e" letter-spacing="0.5">4 &#183; FLARE LOCAL ANCESTRY</text>
  <rect x="120" y="632" width="300" height="48" rx="10" fill="#eef1f4" stroke="#8a94a3" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="270" y="655" text-anchor="middle" font-size="12" fill="#37474f">Targeted panel:</text>
  <text x="270" y="671" text-anchor="middle" font-size="12" fill="#37474f">1KG-HGDP + MX Biobank</text>
  <rect x="480" y="632" width="300" height="48" rx="10" fill="#eef1f4" stroke="#8a94a3" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="630" y="655" text-anchor="middle" font-size="12" fill="#37474f">Comparison panel</text>
  <text x="630" y="671" text-anchor="middle" font-size="11" fill="#8a94a3">(broad AMR, no MXB)</text>
  <rect x="175" y="720" width="550" height="58" rx="10" fill="#dbe6f4" stroke="#3f6191" stroke-width="1.5"/>
  <text x="450" y="746" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e2937">FLARE local-ancestry inference</text>
  <text x="450" y="765" text-anchor="middle" font-size="11.5" fill="#56606e">phased target + reference &#183; combined 2-/3-way run vs each panel</text>
  <line x1="320" y1="588" x2="410" y2="720" stroke="#56606e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="588" x2="500" y2="720" stroke="#56606e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="285" y1="680" x2="410" y2="720" stroke="#8a94a3" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowd)"/>
  <line x1="615" y1="680" x2="500" y2="720" stroke="#8a94a3" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowd)"/>

  <!-- ================= STAGE 5 : POST ================= -->
  <text x="34" y="836" font-size="12.5" font-weight="700" fill="#56606e" letter-spacing="0.5">5 &#183; POST-PROCESSING</text>
  <line x1="450" y1="778" x2="450" y2="826" stroke="#56606e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="225" y="826" width="450" height="46" rx="10" fill="#e7eaee" stroke="#5f6b7a" stroke-width="1.5"/>
  <text x="450" y="854" text-anchor="middle" font-size="13" fill="#1e2937">Fill uncalled variants by nearest tract</text>
  <line x1="450" y1="872" x2="450" y2="906" stroke="#56606e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="225" y="906" width="450" height="46" rx="10" fill="#e7eaee" stroke="#5f6b7a" stroke-width="1.5"/>
  <text x="450" y="934" text-anchor="middle" font-size="13" fill="#1e2937">Format for Tractor  (ancestry-aware GWAS)</text>

  <!-- legend -->
  <line x1="300" y1="982" x2="330" y2="982" stroke="#56606e" stroke-width="1.5"/>
  <text x="337" y="986" font-size="11" fill="#56606e">data flow</text>
  <line x1="430" y1="982" x2="460" y2="982" stroke="#8a94a3" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="467" y="986" font-size="11" fill="#8a94a3">reference panel input</text>
</svg>
